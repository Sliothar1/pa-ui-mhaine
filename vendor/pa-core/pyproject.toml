[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pa-core"
version = "0.1.0"
description = "PA shared data contract: TSV associative arrays, provenance, default-deny export (stdlib only)"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
pa-d4m = "pa_core.cli:main"

[tool.setuptools]
packages = ["pa_core", "pa_core.adapters"]
