name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - name: Unit tests (stdlib only, no installs)
        run: python3 -m unittest discover -s tests -v
      - name: CLI smoke
        run: python3 pa_d4m.py --version
